name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Archive (no signing)
        run: |
          xcodebuild archive \
            -project EkkoLite.xcodeproj \
            -scheme EkkoLite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EkkoLite.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcpretty || xcodebuild archive \
            -project EkkoLite.xcodeproj \
            -scheme EkkoLite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EkkoLite.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/EkkoLite.xcarchive/Products/Applications/EkkoLite.app"
          test -d "$APP" || { echo "找不到 EkkoLite.app"; ls -R "$RUNNER_TEMP/EkkoLite.xcarchive/Products"; exit 1; }
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry EkkoLite-unsigned.ipa Payload
          ls -lh EkkoLite-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EkkoLite-unsigned-ipa
          path: EkkoLite-unsigned.ipa
          retention-days: 30
