name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: xcodebuild -version

      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EkkoLite.xcodeproj \
            -scheme EkkoLite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EkkoLite.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/EkkoLite.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "APP = $APP"
          if [ -z "$APP" ]; then
            echo "没找到 .app，输出目录内容："
            ls -R "$RUNNER_TEMP/EkkoLite.xcarchive/Products" || true
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry EkkoLite-unsigned.ipa Payload
          ls -lh EkkoLite-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EkkoLite-unsigned-ipa
          path: EkkoLite-unsigned.ipa
          retention-days: 30
