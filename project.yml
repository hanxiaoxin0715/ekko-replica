name: EkkoLite

options:
  bundleIdPrefix: com.ekkolite
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  EkkoLite:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: EkkoTasksWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ekko Lite
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ekkolite.app
            CFBundleURLSchemes:
              - ekkolite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ekkolite.app
        TARGETED_DEVICE_FAMILY: "1,2"

  EkkoTasksWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Ekko Tasks
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ekkolite.app.widget
        SKIP_INSTALL: "YES"

schemes:
  EkkoLite:
    build:
      targets:
        EkkoLite: all
    run:
      config: Debug
    archive:
      config: Release
